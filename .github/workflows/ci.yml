name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the standard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm run verify
      - name: Generated assets match the vocabulary and design
        run: git diff --exit-code -- public/badge public/og
      - name: Exercise the MCP protocol
        run: npm run test:server --prefix mcp
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check layout, interaction and accessibility
        run: npm run test:browser
